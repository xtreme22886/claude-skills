# claude-dev-team default settings.
#
# These are the bundle's baked-in defaults. Per-machine overrides go in
# ~/.config/claude-dev-team/config.toml. Per-project overrides go in
# .claude/project.json (the project's own config file, written by /dev-team-init).
#
# Precedence: project > user > defaults.
#
# Do not edit this file to override behavior — your changes will be wiped on
# /dev-team-update. Edit ~/.config/claude-dev-team/config.toml instead.

[enforcement]
# How strictly to enforce phase, slice-shape, and doc-presence rules.
# "advisory"  = warn but allow the action
# "strict"    = block out-of-phase actions, require docs at review
# Per-project override available in .claude/project.json.
mode = "advisory"

[slice]
# Target session length for one slice (hours). Used as a soft signal when
# /work-start is given an issue that looks too big.
target_session_hours = 3
# Hard ceiling. Above this, /work-start refuses unless the issue is labeled
# `epic` and has linked sub-issues.
ceiling_hours = 8

[ci]
# Number of times to retry a failed CI pipeline that looks like a flake
# (network errors, runner-killed, timeouts) before treating it as a real failure.
flake_retry_budget = 1

[verify_fast]
# Maximum wall-clock seconds for the local pre-push verify-fast hook.
# Anything that takes longer should run in CI, not in pre-push.
budget_seconds = 30

[notion]
# Org-wide Engineering Docs database ID. Leave blank in defaults; populated
# by /dev-team-setup into the user config.
database_id = ""
# Refresh cadence for the cross-project Notion dashboard. The cron schedule
# is set up by /dev-team-setup using the cron skill.
dashboard_cadence = "nightly"

[paths]
# Per-user config file location.
user_config = "~/.config/claude-dev-team/config.toml"
# Where the bundle is expected to be cloned. Used by /dev-team-update.
bundle_dir = "~/dev/claude-dev-team"

[trackers]
# Hosts the bundle recognizes. Used by adapter/tracker.py to dispatch
# git remote URLs to the right CLI.
github_hosts = ["github.com"]
# GitLab hosts populated by /dev-team-setup based on which internal hosts
# the user has configured glab auth for.
gitlab_hosts = []

[skill_updates]
# How the SessionStart hook checks for bundle updates.
# "fetch" = run `git fetch` and compare; print a one-liner if behind.
# "off"   = never check (manual /dev-team-update only).
check = "fetch"

[telemetry]
# Per-project events.jsonl logging. Local only, no network.
events_log = true
flakes_log = true
